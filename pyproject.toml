[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayzorgendb"
version = "1.0.0"
description = "Embedded local database. Instant, clean, ready to use."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["database", "embedded", "sql", "nosql", "vector", "time-travel", "cdc", "timeseries"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/riza-del/rayzorgendb"
Repository = "https://github.com/riza-del/rayzorgendb"
Issues = "https://github.com/riza-del/rayzorgendb/issues"

[project.scripts]
rayzorgen = "rayzorgendb.cli.main:main"

[tool.setuptools]
packages = {find = {exclude = ["tests*", "examples*"]}}
