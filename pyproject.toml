[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rayzorgendb"
version = "1.0.0"
description = "Embedded multi-engine database. Zero dependency."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "RayzorgenDB Contributors"},
]
requires-python = ">=3.8"
keywords = [
    "database", "embedded", "sql", "nosql", "vector",
    "time-travel", "cdc", "timeseries",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/yourname/rayzorgendb"
Repository = "https://github.com/yourname/rayzorgendb"
Issues = "https://github.com/yourname/rayzorgendb/issues"

[project.scripts]
rayzorgen = "rayzorgendb.cli.main:main"

[tool.setuptools]
packages = {find = {exclude = ["tests*", "examples*"]}}
